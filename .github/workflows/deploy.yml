name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Next.js web app deploys via Vercel's native Git integration (project
# linked in the Vercel dashboard), which builds every push to main and posts
# its own commit status. This workflow only builds and publishes the worker
# image; a duplicate GitHub-Action Vercel deploy lived here previously and
# was removed -- it needed its own VERCEL_* secrets and only ever double-
# deployed what Vercel was already shipping.

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/evernaro-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/evernaro-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
