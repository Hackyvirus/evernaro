name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Minimal env vars required for a production build without real secrets.
          DATABASE_URL: postgresql://localhost:5432/everreach
          DIRECT_URL: postgresql://localhost:5432/everreach
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-auth-secret-not-for-production-ci-only' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'ci-encryption-key-not-for-production-ci-only' }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
