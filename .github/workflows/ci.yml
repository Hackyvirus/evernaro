name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Minimal env vars required for a production build without real secrets.
          DATABASE_URL: postgresql://localhost:5432/evernaro
          DIRECT_URL: postgresql://localhost:5432/evernaro
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-auth-secret-not-for-production-ci-only' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'ci-encryption-key-not-for-production-ci-only' }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the worker image on every push/PR so Docker-specific build
      # failures (e.g. Redis/Prisma connection during static generation)
      # are caught before deploy time.
      - name: Build worker Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: evernaro-worker:ci

      - name: Build app Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: evernaro-app:ci
